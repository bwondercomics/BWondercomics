services:
  bwondercomics-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BWC_DB_NAME:-bwondercomics}
      POSTGRES_USER: ${BWC_DB_USER:-bwondercomics}
      POSTGRES_PASSWORD: ${BWC_DB_PASSWORD}
    ports:
      - "127.0.0.1:${BWC_DB_PORT:-5433}:5432"
    volumes:
      - bwondercomics-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BWC_DB_USER:-bwondercomics} -d ${BWC_DB_NAME:-bwondercomics}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bwondercomics-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      bwondercomics-db:
        condition: service_healthy
    env_file:
      - ./bwondercomics.env
    environment:
      BWC_DB_HOST: bwondercomics-db
      BWC_DB_PORT: 5432
      BWC_BACKUP_DIAGNOSTICS_MODE: production
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      OIDC_LOGIN_PATH: ${OIDC_LOGIN_PATH:-/?openComments=1}
    ports:
      - "127.0.0.1:${BWC_API_PORT:-8000}:8000"
    user: "${BWC_UID:-1000}:${BWC_GID:-1000}"
    working_dir: /srv/bwondercomics
    volumes:
      - ..:/srv/bwondercomics
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:3.0.3@sha256:28f263fe06f79ebffa5a6a6e9bd33b7a278e9342a88e0bdac812416c9f9e4361
    restart: unless-stopped
    profiles: ["analytics"]
    init: true
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    ports:
      - "${UMAMI_BIND:-127.0.0.1}:${UMAMI_PORT:-3000}:3000"

  stoat-mongodb:
    image: mongo:7
    restart: unless-stopped
    profiles: ["chat"]
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - stoat-mongodb:/data/db
    networks:
      default:
        aliases:
          - database

  stoat-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["chat"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - stoat-redis:/data
    networks:
      default:
        aliases:
          - redis

  stoat-rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    profiles: ["chat"]
    environment:
      RABBITMQ_DEFAULT_USER: ${STOAT_RABBITMQ_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${STOAT_RABBITMQ_PASSWORD:-rabbitpass}
    volumes:
      - stoat-rabbitmq:/var/lib/rabbitmq
    networks:
      default:
        aliases:
          - rabbit
          - rabbitmq

  stoat-minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["chat"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STOAT_MINIO_ROOT_USER:-minioautumn}
      MINIO_ROOT_PASSWORD: ${STOAT_MINIO_ROOT_PASSWORD:-minioautumn}
    volumes:
      - stoat-minio:/data
    networks:
      default:
        aliases:
          - minio

  stoat-minio-init:
    image: minio/mc:latest
    restart: "no"
    profiles: ["chat"]
    depends_on:
      - stoat-minio
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        until mc alias set local http://stoat-minio:9000 "${STOAT_MINIO_ROOT_USER:-minioautumn}" "${STOAT_MINIO_ROOT_PASSWORD:-minioautumn}"; do
          sleep 1
        done
        mc mb --ignore-existing "local/${STOAT_S3_BUCKET:-revolt-uploads}"
    networks:
      default:

  # Stoat API (Delta) service.
  # Exact env var names can differ by Stoat release; keep these in bwondercomics.env
  # and align with the pinned release docs.
  stoat-api:
    image: ${STOAT_API_IMAGE:-ghcr.io/revoltchat/server:20250930-2}
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      - stoat-mongodb
      - stoat-redis
      - stoat-rabbitmq
      - stoat-minio
      - stoat-minio-init
    env_file:
      - ./bwondercomics.env
    environment:
      STOAT_MONGODB_URI: ${STOAT_MONGODB_URI:-mongodb://stoat-mongodb:27017/revolt}
      STOAT_REDIS_URI: ${STOAT_REDIS_URI:-redis://stoat-redis:6379}
      STOAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://chat.bwondercomics.com}
    volumes:
      - ./stoat/Revolt.overrides.toml:/home/nonroot/Revolt.overrides.toml:ro
      - ./stoat/Revolt.overrides.toml:/Revolt.overrides.toml:ro
    networks:
      default:
        aliases:
          - api
          - delta

  # Optional dedicated Delta service if your Stoat release separates API and Delta.
  stoat-delta:
    image: ${STOAT_DELTA_IMAGE:-ghcr.io/revoltchat/server:20250930-2}
    restart: unless-stopped
    profiles: ["chat-delta"]
    depends_on:
      - stoat-mongodb
      - stoat-redis
      - stoat-rabbitmq
      - stoat-minio
      - stoat-minio-init
    env_file:
      - ./bwondercomics.env
    environment:
      STOAT_MONGODB_URI: ${STOAT_MONGODB_URI:-mongodb://stoat-mongodb:27017/revolt}
      STOAT_REDIS_URI: ${STOAT_REDIS_URI:-redis://stoat-redis:6379}
      STOAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://chat.bwondercomics.com}
    volumes:
      - ./stoat/Revolt.overrides.toml:/home/nonroot/Revolt.overrides.toml:ro
      - ./stoat/Revolt.overrides.toml:/Revolt.overrides.toml:ro
    networks:
      default:
        aliases:
          - delta

  stoat-events:
    image: ${STOAT_EVENTS_IMAGE:-ghcr.io/revoltchat/bonfire:20250930-2}
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      - stoat-api
      - stoat-redis
    networks:
      default:
        aliases:
          - events

  stoat-autumn:
    image: ${STOAT_AUTUMN_IMAGE:-ghcr.io/revoltchat/autumn:20250930-2}
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      - stoat-mongodb
      - stoat-redis
      - stoat-rabbitmq
      - stoat-minio
      - stoat-minio-init
    env_file:
      - ./bwondercomics.env
    environment:
      STOAT_MONGODB_URI: ${STOAT_MONGODB_URI:-mongodb://stoat-mongodb:27017/revolt}
      STOAT_REDIS_URI: ${STOAT_REDIS_URI:-redis://stoat-redis:6379}
      STOAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://chat.bwondercomics.com}
    volumes:
      - ./stoat/Revolt.overrides.toml:/home/nonroot/Revolt.overrides.toml:ro
      - ./stoat/Revolt.overrides.toml:/Revolt.overrides.toml:ro
    networks:
      default:
        aliases:
          - autumn

  stoat-january:
    image: ${STOAT_JANUARY_IMAGE:-ghcr.io/revoltchat/january:20250930-2}
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      - stoat-api
      - stoat-redis
      - stoat-rabbitmq
      - stoat-minio
      - stoat-minio-init
    env_file:
      - ./bwondercomics.env
    environment:
      STOAT_MONGODB_URI: ${STOAT_MONGODB_URI:-mongodb://stoat-mongodb:27017/revolt}
      STOAT_REDIS_URI: ${STOAT_REDIS_URI:-redis://stoat-redis:6379}
      STOAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-https://chat.bwondercomics.com}
    volumes:
      - ./stoat/Revolt.overrides.toml:/home/nonroot/Revolt.overrides.toml:ro
      - ./stoat/Revolt.overrides.toml:/Revolt.overrides.toml:ro
    networks:
      default:
        aliases:
          - january

  stoat-web:
    image: ${STOAT_WEB_IMAGE:-ghcr.io/revoltchat/client@sha256:5cc05853c215a02ee3d1f71390ad00af06c7ef53602b4b21f419f8702607d8c8}
    restart: unless-stopped
    # Legacy revite frontend; kept only for rollback.
    # Active chat UI is served statically by Caddy from deploy/stoat/for-web-dist.
    profiles: ["chat-legacy-ui"]
    depends_on:
      - stoat-api
      - stoat-events
      - stoat-autumn
      - stoat-january
    env_file:
      - ./bwondercomics.env
    environment:
      REVOLT_PUBLIC_URL: ${CHAT_API_PUBLIC_URL:-https://chat.bwondercomics.com/api}
      REVOLT_APP_URL: ${CHAT_PUBLIC_URL:-https://chat.bwondercomics.com}

  stoat-livekit:
    image: ${STOAT_LIVEKIT_IMAGE:-livekit/livekit-server:v1.7.2}
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      - stoat-redis
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./stoat/livekit.yaml:/etc/livekit.yaml:ro
      - caddy-data:/caddy-data:ro
    ports:
      - "${STOAT_LIVEKIT_TCP_PORT:-7881}:7881/tcp"
      - "${STOAT_LIVEKIT_TURN_UDP_PORT:-443}:443/udp"
      - "${STOAT_LIVEKIT_TURN_TLS_PORT:-5349}:5349/tcp"
      - "${STOAT_LIVEKIT_UDP_PORT_RANGE:-50000-50100}:50000-50100/udp"
      - "${STOAT_LIVEKIT_TURN_RELAY_UDP_PORT_RANGE:-51000-51100}:51000-51100/udp"
    networks:
      default:
        aliases:
          - livekit

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./bwondercomics.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../dist:/srv/bwondercomics/dist:ro
      - ../comics:/srv/bwondercomics/comics:ro
      - ../media:/srv/bwondercomics/media:ro
      - ../assets:/srv/bwondercomics/assets:ro
      - ..:/srv/bwondercomics/root:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ../var/log/caddy:/var/log/caddy

volumes:
  bwondercomics-db:
  umami-db:
  stoat-mongodb:
  stoat-redis:
  stoat-rabbitmq:
  stoat-minio:
  caddy-data:
  caddy-config:
