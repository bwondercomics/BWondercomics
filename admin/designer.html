<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting Page Designer</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a12;
        --panel: #151525;
        --border: #00d9ff;
        --text: #ffffff;
        --muted: #9fb3c8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(0, 217, 255, 0.18), transparent 40%), var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .bridge-card {
        width: min(560px, 100%);
        padding: 24px;
        border: 1px solid rgba(0, 217, 255, 0.35);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(21, 21, 37, 0.98), rgba(10, 10, 18, 0.98));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="bridge-card">
      <h1>Redirecting to the integrated builder</h1>
      <p>
        The standalone Page Designer now bridges into the admin builder header editor. If you are
        not redirected automatically,
        <a id="builderLink" href="index.html?view=designer&amp;surface=header">open the builder</a>.
      </p>
    </main>
    <script>
      (function () {
        'use strict';

        function sanitizeSeriesId(raw) {
          return String(raw || '')
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9_-]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 64);
        }

        function sanitizePageSlug(raw) {
          return String(raw || '')
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9-]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 80);
        }

        const params = new URLSearchParams(window.location.search);
        const next = new URL('index.html', window.location.href);
        next.searchParams.set('view', 'designer');
        next.searchParams.set('surface', 'header');

        const seriesId = sanitizeSeriesId(params.get('series'));
        const pageSlug = sanitizePageSlug(params.get('page'));
        if (seriesId) {
          next.searchParams.set('series', seriesId);
        }
        if (pageSlug) {
          next.searchParams.set('page', pageSlug);
        }

        const href = next.toString();
        const link = document.getElementById('builderLink');
        if (link) {
          link.href = href;
        }

        const targetWindow = window.top && window.top !== window ? window.top : window;
        targetWindow.location.replace(href);
      })();
    </script>
  </body>
</html>
