## LEGACY: Remark42 stack (deprecated; native comments now live in `backend/`).
version: '3.8'

services:
  remark42:
    image: umputun/remark42:latest
    container_name: remark42
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Main configuration
      - REMARK_URL=${REMARK_URL}
      - SECRET=${REMARK_SECRET}
      - SITE=bwondercomics
      
      # Google OAuth
      - AUTH_GOOGLE_CID=${GOOGLE_CLIENT_ID}
      - AUTH_GOOGLE_CSEC=${GOOGLE_CLIENT_SECRET}
      
      # Admin configuration
      - ADMIN_SHARED_ID=${ADMIN_EMAIL}
      
      # Optional: Enable anonymous comments (set to true if you want)
      - AUTH_ANON=false
      
      # Storage
      - STORE_BOLT_PATH=/srv/var/db
      - BACKUP_PATH=/srv/var/backup
      
    volumes:
      # Persistent storage for comments
      - ./remark42_data:/srv/var
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
