<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
  <title>BWC Media Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #00d9ff;
      --secondary: #ff00ea;
      --accent: #ffed00;
      --bg-dark: #0a0a12;
      --bg-panel: #1a1a2e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 20%, rgba(0, 217, 255, 0.06), transparent 25%),
        radial-gradient(circle at 90% 10%, rgba(255, 0, 234, 0.06), transparent 25%),
        linear-gradient(180deg, rgba(10, 10, 18, 0.95) 0%, #05050a 100%);
      color: var(--text);
      font-family: 'Righteous', cursive;
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.16), rgba(255, 0, 234, 0.12));
      border-bottom: 3px solid var(--primary);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
    }

    .header-nav {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: var(--text);
      color: var(--bg-dark);
    }

    h1 {
      font-family: 'Bebas Neue', cursive;
      color: var(--primary);
      margin: 0;
      font-size: 2.8rem;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--secondary);
    }

    .subhead {
      color: rgba(255, 255, 255, 0.75);
      margin-top: 6px;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--text);
      color: var(--bg-dark);
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid var(--primary);
      background: var(--bg-panel);
      color: var(--text);
      font-family: 'Righteous', cursive;
      font-size: 1rem;
    }

    .tags-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: rgba(0, 217, 255, 0.12);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .tag-pill.active {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-panel);
      border: 2px solid var(--primary);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.18);
      display: flex;
      flex-direction: column;
      min-height: 240px;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #05050a;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-path {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
      word-break: break-all;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-tag {
      background: rgba(255, 237, 0, 0.15);
      color: var(--accent);
      border: 1px solid rgba(255, 237, 0, 0.4);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: rgba(255, 255, 255, 0.8);
      border: 2px dashed rgba(0, 217, 255, 0.3);
      border-radius: 12px;
      background: rgba(26, 26, 46, 0.6);
      grid-column: 1 / -1;
    }

    .error {
      color: var(--secondary);
      text-align: center;
      margin-bottom: 12px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .lightbox img {
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background: #05050a;
      box-shadow: 0 0 24px rgba(0, 217, 255, 0.35);
    }

    .lightbox-close {
      position: absolute;
      top: -12px;
      right: -12px;
      background: var(--secondary);
      color: var(--text);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .lightbox-btn {
      background: rgba(0, 217, 255, 0.3);
      border: 2px solid var(--primary);
      color: var(--text);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    .lightbox-btn:hover {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: 0 0 14px rgba(0, 217, 255, 0.6);
    }

    .lightbox-meta {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      .card img {
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-brand">
      <h1>BWC Media</h1>
      <div class="subhead">Browse artwork attached to feed posts.</div>
    </div>
    <div class="header-nav">
      <a href="index.html" class="nav-btn">&#8592; Back to Comic</a>
      <a href="feed.html" class="nav-btn">Feed</a>
    </div>
  </header>

  <div class="container">
    <div class="error" id="error" style="display: none;"></div>

    <div class="search-row">
      <input type="text" id="search" class="search-input" placeholder="Search by tag or filename...">
    </div>

    <div class="tags-bar" id="tagsBar"></div>

    <div class="grid" id="grid">
      <div class="empty-state">Loading media...</div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
    <div class="lightbox-content">
      <button class="lightbox-btn" id="prevBtn" aria-label="Previous">&#8592;</button>
      <img id="lightboxImg" src="" alt="">
      <button class="lightbox-btn" id="nextBtn" aria-label="Next">&#8594;</button>
      <button class="lightbox-close" id="closeBtn" aria-label="Close">&times;</button>
      <div class="lightbox-meta" id="lightboxMeta"></div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const tagsBar = document.getElementById('tagsBar');
    const searchInput = document.getElementById('search');
    const errorEl = document.getElementById('error');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxMeta = document.getElementById('lightboxMeta');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const closeBtn = document.getElementById('closeBtn');

    let mediaItems = [];
    let activeTag = '';
    let currentIndex = -1;

    function setError(message) {
      if (!errorEl) return;
      if (message) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
      } else {
        errorEl.style.display = 'none';
      }
    }

    function normalizeTags(tags) {
      return Array.isArray(tags)
        ? tags.map(t => String(t).trim().toLowerCase()).filter(Boolean)
        : [];
    }

    function renderTags() {
      tagsBar.innerHTML = '';
      const allTags = Array.from(new Set(mediaItems.flatMap(m => normalizeTags(m.tags || [])))).sort();
      if (!allTags.length) return;

      const all = document.createElement('button');
      all.className = `tag-pill ${activeTag === '' ? 'active' : ''}`;
      all.textContent = 'All';
      all.addEventListener('click', () => {
        activeTag = '';
        renderTags();
        renderGrid();
      });
      tagsBar.appendChild(all);

      allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = `tag-pill ${activeTag === tag ? 'active' : ''}`;
        btn.textContent = tag;
        btn.addEventListener('click', () => {
          activeTag = activeTag === tag ? '' : tag;
          renderTags();
          renderGrid();
        });
        tagsBar.appendChild(btn);
      });
    }

    function renderGrid() {
      grid.innerHTML = '';
      const term = (searchInput.value || '').trim().toLowerCase();

      const filtered = mediaItems.filter(item => {
        const path = (item.path || '').toLowerCase();
        const tags = normalizeTags(item.tags || []);
        const matchesTag = activeTag ? tags.includes(activeTag) : true;
        const matchesTerm = term
          ? path.includes(term) || tags.some(t => t.includes(term))
          : true;
        return matchesTag && matchesTerm;
      });

      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No media found for that search. Try another tag or term.';
        grid.appendChild(empty);
        return;
      }

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = item.path || 'Media item';
        img.src = item.path || '';
        img.onerror = () => { img.style.opacity = '0.3'; };
        img.addEventListener('click', () => openLightbox(filtered, index));
        card.appendChild(img);

        const body = document.createElement('div');
        body.className = 'card-body';
        const pathEl = document.createElement('div');
        pathEl.className = 'card-path';
        pathEl.textContent = item.path || 'Unknown path';
        body.appendChild(pathEl);

        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'card-tags';
        const tags = normalizeTags(item.tags || []);
        if (tags.length) {
          tags.forEach(tag => {
            const pill = document.createElement('span');
            pill.className = 'card-tag';
            pill.textContent = tag;
            tagsWrap.appendChild(pill);
          });
        } else {
          const none = document.createElement('span');
          none.className = 'card-tag';
          none.textContent = 'untagged';
          tagsWrap.appendChild(none);
        }
        body.appendChild(tagsWrap);

        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function openLightbox(list, index) {
      if (!list.length) return;
      mediaItems = list; // scoped to filtered set so nav respects search/tag filter
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      currentIndex = -1;
    }

    function updateLightbox() {
      if (currentIndex < 0 || currentIndex >= mediaItems.length) return closeLightbox();
      const item = mediaItems[currentIndex];
      lightboxImg.src = item.path || '';
      lightboxImg.alt = item.path || 'Media item';
      const tags = normalizeTags(item.tags || []);
      lightboxMeta.textContent = `${item.path || ''}${tags.length ? ' • ' + tags.join(', ') : ''}`;
    }

    function goNext(delta) {
      if (currentIndex < 0) return;
      currentIndex = (currentIndex + delta + mediaItems.length) % mediaItems.length;
      updateLightbox();
    }

    async function loadMedia() {
      try {
        const response = await fetch('media.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Failed to load media.json');
        const data = await response.json();
        mediaItems = Array.isArray(data) ? data : [];
        setError('');
      } catch (error) {
        console.error(error);
        mediaItems = [];
        setError('Media library could not be loaded. Add items via the admin to generate media.json.');
      }
      renderTags();
      renderGrid();
    }

    searchInput.addEventListener('input', renderGrid);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', () => goNext(-1));
    nextBtn.addEventListener('click', () => goNext(1));
    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') goNext(-1);
      if (e.key === 'ArrowRight') goNext(1);
    });
    loadMedia();
  </script>
</body>

</html>
